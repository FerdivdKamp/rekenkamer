[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rekenkamer-data-pipeline"
version = "0.1.0"
description = "Data ingestion and data quality checks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pandas>=2.2,<3",
    "openpyxl>=3.1,<4",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "httpx>=0.27,<1",
]

[project.scripts]
rekenkamer-pipeline = "rekenkamer_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rekenkamer_pipeline = ["*.json"]
